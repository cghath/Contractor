# Runs the headless test suites (tools/run_tests.sh) on every push and pull request, one job
# per suite so a failure names its suite. Uses the Linux editor of the Voxel Tools release the
# README points at (Godot 4.7.2 + Voxel Tools 1.7, standard precision), cached between runs.
# A manual run (workflow_dispatch) can name only some suites (input "suites", e.g.
# `gh workflow run tests.yml --ref <branch> -f suites="world casualty"`): repeat runs of a few
# suites without the whole matrix. Push and pull_request runs always run every suite.
# Runners pinned to ubuntu-24.04: ubuntu-latest moves to Ubuntu 26 from 2026-10-19, and the
# suites aren't proven there yet.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      suites:
        description: "Only these suites (space- or comma-separated); empty: every suite"
        required: false
        default: ""
        type: string

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  VOXEL_RELEASE: v1.7
  GODOT_ZIP: godot.linuxbsd.editor.x86_64.zip

jobs:
  # The runner itself: a fake engine checks that script errors, missing summaries, hangs and a
  # failed import fail (no Godot needed).
  runner:
    name: test runner
    # A manual run naming suites runs only those (no runner check).
    if: ${{ !inputs.suites }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # runner.temp isn't available in a job's env (GitHub rejects the workflow), only in steps.
      - name: Check tools/run_tests.sh
        run: bash tools/test_runner_check.sh
        env:
          CONTRACTOR_TEST_LOGS: ${{ runner.temp }}/contractor-test-logs
      - name: Check draft release publishing
        run: bash tools/test_publish_release.sh
        env:
          CONTRACTOR_TEST_LOGS: ${{ runner.temp }}/contractor-test-logs
      - name: Keep runner and publishing logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-runner
          path: ${{ runner.temp }}/contractor-test-logs
          if-no-files-found: warn

  # Which suites this run runs: every one (ALL_SUITES, the same as tools/run_tests.sh runs by
  # default: tools/check_ci_suites.sh checks they match), or a manual run's "suites".
  plan:
    name: pick the suites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.pick.outputs.suites }}
    steps:
      - name: Pick the suites
        id: pick
        env:
          ALL_SUITES: smoke gameplay squad spacing net levelswitch wounds armor exo mech movement mantle interaction roles medical devices logistics casualty materials animations scavenge contracts people map base world missions vehicles antiarmor session_log supports heliflight bay aav sound loop ui loadout weapons ballistics forest townperf markers pallets voice compass audit_fixes garrison daynight nvg attachments controller base_zone loot tutorial lhd_home story virtualization gore firesupport demolitions landmarks
          ONLY: ${{ inputs.suites }}
        run: |
          want="$(echo "${ONLY:-}" | tr ',' ' ')"
          [ -n "${want// /}" ] || want="$ALL_SUITES"
          for s in $want; do
            case " $ALL_SUITES " in
              *" $s "*) ;;
              *) echo "::error title=suites::no suite named '$s' (suites: $ALL_SUITES)"; exit 1 ;;
            esac
          done
          json="$(printf '%s\n' $want | awk '!seen[$0]++' | jq -R . | jq -cs .)"
          echo "suites: $json"
          echo "suites=$json" >> "$GITHUB_OUTPUT"

  suite:
    name: ${{ matrix.suite }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache the Voxel Tools editor
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot-voxel
          key: godot-voxel-${{ env.VOXEL_RELEASE }}-${{ env.GODOT_ZIP }}

      - name: Download the Voxel Tools editor
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-voxel
          curl -sSfL -o /tmp/godot.zip "https://github.com/Zylann/godot_voxel/releases/download/${VOXEL_RELEASE}/${GODOT_ZIP}"
          unzip -q /tmp/godot.zip -d ~/godot-voxel

      - name: Find the editor binary
        run: |
          bin="$(find ~/godot-voxel -type f -name 'godot.linuxbsd.editor.x86_64*' | head -n1)"
          test -n "$bin" || { echo "no editor binary in the release zip"; exit 1; }
          chmod +x "$bin"
          echo "GODOT=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      # The runner keeps the run's own logs (import, the suite, and host and client for the
      # two-process suites, plus summary.txt with the CI run and commit) in CONTRACTOR_TEST_LOGS.
      - name: Run the ${{ matrix.suite }} suite
        env:
          CONTRACTOR_TEST_TAG: ci-${{ matrix.suite }}
          CONTRACTOR_TEST_LOGS: ${{ runner.temp }}/contractor-test-logs
        run: bash tools/run_tests.sh ${{ matrix.suite }}

      # On failure, show the end of every log that run kept (the same processes, not a rerun)
      # and raise their failing checks and script errors as annotations (shown on the run page;
      # job logs need repo admin rights). The runner's own annotations come first, above.
      - name: Show why ${{ matrix.suite }} failed
        if: failure()
        env:
          CONTRACTOR_TEST_LOGS: ${{ runner.temp }}/contractor-test-logs
        run: |
          shopt -s nullglob
          for f in "$CONTRACTOR_TEST_LOGS"/*/R*/summary.txt "$CONTRACTOR_TEST_LOGS"/*/R*/*.log; do
            echo "===== $(basename "$(dirname "$f")")/$(basename "$f"), last 200 lines"
            tail -n 200 "$f"
          done
          for d in "$CONTRACTOR_TEST_LOGS"/*/R*/; do
            (cd "$d" && grep -HE '\[FAIL\]|SCRIPT ERROR|Parse Error|ERROR:|TEST (FAILED|PASSED)' -- *.log)
          done | head -n 10 | while IFS= read -r line; do
            echo "::error title=${{ matrix.suite }}::${line}"
          done

      # Whatever the verdict (passed, failed, cancelled or out of time), keep those logs as the
      # run's "test-logs-<suite>" artifact.
      - name: Keep the ${{ matrix.suite }} logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.suite }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contractor-test-logs
          if-no-files-found: warn
