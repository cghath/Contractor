# A test build of dev every night that dev moved, so there's always something to play between
# version builds. Kept as a workflow artifact for 14 days: "contractor-nightly-<commit>", the
# build folder tools/ci_build.sh makes (Contractor.exe, contractor.pck, the launchers,
# BUILD.txt, GET_GODOT.txt, licenses/), on the run's page under Actions > Nightly build. No
# editor in it (Contractor.exe needs none; GET_GODOT.txt says where play.bat's comes from).
#
# "Moved": the build is skipped when dev's tip already has a nightly artifact that hasn't
# expired, so a quiet dev costs one short check a night and nothing else; once the last one
# expires (14 days without a commit) the same commit is built again, so there's always one to
# download. A manual run (Actions tab or `gh workflow run nightly.yml -f ref=<branch>`) builds
# "ref" (default dev), and "force" builds it even when it already has one.
#
# Scheduled runs only start from the default branch's copy of this file (main), and GitHub
# stops a repository's schedules after 60 days without activity on it.
name: Nightly build

on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC, after the evening's pushes on both sides
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to build"
        required: false
        default: dev
        type: string
      force:
        description: "Build even if this commit already has a nightly"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly-${{ inputs.ref || 'dev' }}
  cancel-in-progress: false

env:
  VOXEL_RELEASE: v1.7

jobs:
  # Is there anything new? The branch's tip, and whether it already has a nightly artifact.
  check:
    name: anything new
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.look.outputs.ref }}
      build: ${{ steps.look.outputs.build }}
    steps:
      - name: Look for this commit's nightly
        id: look
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          FORCE: ${{ inputs.force }}
        run: |
          case "$EVENT" in
            schedule) ref=dev ;;
            workflow_dispatch) ref="${INPUT_REF:-dev}" ;;
            *) ref="$GITHUB_REF_NAME" ;;
          esac
          ref="${ref#refs/heads/}"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/heads/$ref" --jq .sha 2>/dev/null || gh api "repos/$GITHUB_REPOSITORY/commits/$ref" --jq .sha)"
          name="contractor-nightly-${sha:0:10}"
          have="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=100" --jq '[.artifacts[] | select(.expired | not)] | length')"
          build=true
          if [ "${have:-0}" -gt 0 ] && [ "$FORCE" != true ]; then
            build=false
            echo "::notice title=nightly::$ref is at ${sha:0:10}, which already has a nightly ($name): nothing new, no build"
          fi
          echo "$ref at $sha: nightly artifacts $have, build $build"
          { echo "ref=$ref"; echo "build=$build"; } >> "$GITHUB_OUTPUT"

  build:
    name: build
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      # The branch itself (not the commit), so BUILD.txt and the build label name the branch.
      # If it moved since the check, the newer tip is built and named for what was built.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.ref }}

      - name: Cache the Voxel Tools editor and template
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot-voxel
          key: godot-voxel-windows-${{ env.VOXEL_RELEASE }}

      - name: Download the Voxel Tools editor and template
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-voxel/template_release
          base="https://github.com/Zylann/godot_voxel/releases/download/${VOXEL_RELEASE}"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/editor.zip" "$base/godot.windows.editor.x86_64.exe.zip"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/template.zip" "$base/godot.windows.template_release.x86_64.exe.zip"
          7z x -y -bso0 -o"$(cygpath -w ~/godot-voxel)" "$RUNNER_TEMP/editor.zip"
          7z x -y -bso0 -o"$(cygpath -w ~/godot-voxel/template_release)" "$RUNNER_TEMP/template.zip"

      - name: Find the editor and template
        run: |
          bin="$(find ~/godot-voxel -maxdepth 2 -type f -name 'godot.windows.editor.x86_64.exe' | head -n1)"
          tpl="$(find ~/godot-voxel/template_release -type f -name 'godot.windows.template_release.x86_64.exe' | head -n1)"
          test -n "$bin" || { echo "::error::no editor in the release zip"; exit 1; }
          test -n "$tpl" || { echo "::error::no release template in the release zip"; exit 1; }
          echo "GODOT=$bin" >> "$GITHUB_ENV"
          echo "CONTRACTOR_TEMPLATE=$tpl" >> "$GITHUB_ENV"
          "$bin" --headless --version

      - name: Build
        id: build
        run: |
          export CONTRACTOR_TEST_LOGS="$(cygpath -u "$RUNNER_TEMP")/contractor-test-logs"
          bash tools/ci_build.sh "$(cygpath -u "$RUNNER_TEMP")/nightly" nightly --no-zip
          echo "artifact=contractor-nightly-$(git rev-parse HEAD | cut -c1-10)" >> "$GITHUB_OUTPUT"

      # upload-artifact zips it: one zip with the build folder's files, named for the commit.
      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: ${{ steps.build.outputs.dir }}
          retention-days: 14
          overwrite: true

      - name: Keep the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-logs-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/contractor-test-logs
            ${{ runner.temp }}/nightly/*.log
          retention-days: 14
          if-no-files-found: warn
